<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼스널 컬러 톤 비교 팔레트</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: #101114;
  color: #191919;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.deck {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
}
.slide {
  display: none;
  position: relative;
  width: min(100vw, 177.7778vh);
  height: min(100vh, 56.25vw);
  overflow: hidden;
}
.slide.active { display: block; }
.section {
  background: #f7f4ef;
  text-align: center;
}
.section.active {
  display: grid;
  place-items: center;
}
.section h2 {
  margin: 0;
  font-size: clamp(52px, 9vw, 120px);
  line-height: 1;
  letter-spacing: 0;
  font-weight: 850;
}
.section p {
  margin: 24px 0 0;
  font-size: clamp(18px, 2.4vw, 32px);
  font-weight: 650;
  color: rgba(25, 25, 25, 0.62);
}
.color-slide { background: var(--color); }
.nav-zone {
  position: fixed;
  top: 0;
  bottom: 0;
  width: 30vw;
  border: 0;
  background: transparent;
  color: transparent;
  cursor: pointer;
  z-index: 20;
}
.nav-zone.prev { left: 0; }
.nav-zone.next { right: 0; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
@media print {
  html, body { height: auto; overflow: visible; background: #fff; }
  .deck { position: static; display: block; }
  .slide { display: block; page-break-after: always; width: 100vw; height: 56.25vw; }
  .nav-zone { display: none; }
}
</style>
</head>
<body>
<main class="deck" aria-live="polite">
  <h1 class="sr-only">퍼스널 컬러 톤 비교 팔레트</h1>
</main>

<button class="nav-zone prev" type="button" aria-label="이전 페이지"></button>
<button class="nav-zone next" type="button" aria-label="다음 페이지"></button>

<script type="application/json" id="palette-data">
[

    "colors": ["#E8C18A", "#D49A5A", "#B87333", "#91562A", "#6D4327", "#C65F36", "#A84525", "#8E3F25", "#74351F", "#5B2C1D", "#B58D44", "#8F7937", "#6F7032", "#566734", "#3F5636", "#A97C50", "#866343", "#634733", "#2F5E58", "#1F423D"]
  },
  {
    "title": "겨울 쿨",
    "subtitle": "강하고 선명한 냉기",
    "colors": ["#FFFFFF", "#D9DDE8", "#A8B1C7", "#4A5063", "#050505", "#FF0A6C", "#D0005B", "#B0008E", "#7B1FA2", "#4B0082", "#F5002F", "#C9002B", "#0057D9", "#003EA8", "#001B5B", "#00A676", "#008F8C", "#006A71", "#004B5A", "#172A3A"]

    "colors": ["#FFF1D6", "#FFE3BD", "#FFD0A6", "#FFB58A", "#FF936F", "#FF6F61", "#FFF07A", "#FFD84D", "#CDEB73", "#9BDB68", "#49C7A7", "#42C8D6", "#E8C18A", "#D49A5A", "#B87333", "#A84525", "#8E3F25", "#74351F", "#B58D44", "#8F7937", "#6F7032", "#566734", "#2F5E58", "#1F423D"]
  },

  },

    "colors": ["#FFF4DA", "#FFE6C8", "#FFD0A6", "#FFB7A0", "#FFEFB5", "#DDEB9A", "#B8E6C7", "#A7E0E8", "#FCE7EF", "#EFD7E7", "#E3D8F1", "#D6E4F2", "#C9DDF0", "#CFE7E2", "#B9D8D4", "#AFC2D9", "#FFF8EC", "#F9EEE8", "#F1EAF4", "#EAF1F7", "#E6F3EF", "#F3F1D7", "#ECE9DA", "#DDE2EA"]

    "colors": ["#5B2C1D", "#74351F", "#8E3F25", "#6D4327", "#634733", "#3F5636", "#2F5E58", "#1F423D", "#050505", "#172A3A", "#001B5B", "#003EA8", "#4B0082", "#7B0046", "#850020", "#004B5A", "#2A1A12", "#342317", "#40321C", "#203221", "#142D31", "#111111", "#191827", "#1A1026"]
  },
  {
    "title": "포인트 컬러 비교",
    "subtitle": "계절별 강조색 차이",
    "colors": ["#FFB000", "#FF6F61", "#FF8FA3", "#8EDB65", "#34C7C7", "#3DA5FF", "#D7BFE8", "#B8A3D1", "#8DB5D9", "#75A9A2", "#C98FA6", "#9D8296", "#C96B34", "#A84525", "#B58D44", "#72763A", "#2F5E58", "#6D4327", "#F5002F", "#D0005B", "#B0008E", "#0057D9", "#00A676", "#050505"]
  }
]
</script>
<script>
const groups = JSON.parse(document.getElementById("palette-data").textContent);
const deck = document.querySelector(".deck");

groups.forEach((group) => {
  const section = document.createElement("section");
  section.className = "slide section";
  section.setAttribute("aria-label", group.title + " 섹션");
  section.innerHTML = "<div><h2></h2><p></p></div>";
  section.querySelector("h2").textContent = group.title;
  section.querySelector("p").textContent = group.subtitle;
  deck.appendChild(section);

  group.colors.forEach((color, index) => {
    const slide = document.createElement("section");
    slide.className = "slide color-slide";
    slide.style.setProperty("--color", color);
    slide.setAttribute("aria-label", group.title + " " + (index + 1) + " " + color);
    deck.appendChild(slide);
  });
});

const slides = Array.from(document.querySelectorAll(".slide"));
let current = 0;
let touchStartX = null;

function pageFromHash() {
  const value = Number(window.location.hash.replace("#", ""));
  return Number.isInteger(value) && value >= 1 && value <= slides.length ? value - 1 : 0;
}

function showSlide(index, updateHash = true) {
  current = Math.max(0, Math.min(slides.length - 1, index));
  slides.forEach((slide, slideIndex) => {
    slide.classList.toggle("active", slideIndex === current);
  });
  if (updateHash) {
    history.replaceState(null, "", "#" + (current + 1));
  }
}

function nextSlide() { showSlide(current + 1); }
function prevSlide() { showSlide(current - 1); }

document.querySelector(".nav-zone.next").addEventListener("click", nextSlide);
document.querySelector(".nav-zone.prev").addEventListener("click", prevSlide);

document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
    event.preventDefault();
    nextSlide();
  }
  if (event.key === "ArrowLeft" || event.key === "PageUp") {
    event.preventDefault();
    prevSlide();
  }
  if (event.key === "Home") {
    event.preventDefault();
    showSlide(0);
  }
  if (event.key === "End") {
    event.preventDefault();
    showSlide(slides.length - 1);
  }
  if (event.key.toLowerCase() === "f" && document.fullscreenEnabled) {
    event.preventDefault();
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen();
    }
  }
});

document.addEventListener("touchstart", (event) => {
  touchStartX = event.changedTouches[0].clientX;
}, { passive: true });

document.addEventListener("touchend", (event) => {
  if (touchStartX === null) return;
  const deltaX = event.changedTouches[0].clientX - touchStartX;
  touchStartX = null;
  if (Math.abs(deltaX) < 40) return;
  if (deltaX < 0) nextSlide();
  if (deltaX > 0) prevSlide();
}, { passive: true });

window.addEventListener("hashchange", () => showSlide(pageFromHash(), false));
showSlide(pageFromHash(), false);
</script>
</body>
</html>
